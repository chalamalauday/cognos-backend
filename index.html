<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting to COGNOS 2K26...</title>
</head>
<body style="background: #040814; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to <a id="festLink" href="frontend/" style="color: #00f2fe;">COGNOS 2K26</a>...</p>
    <script>
        fetch('cognos/index.html', { method: 'HEAD' })
            .then(res => {
                if (res.ok) {
                    window.location.replace("cognos/");
                } else {
                    window.location.replace("frontend/");
                }
            })
            .catch(() => {
                window.location.replace("frontend/");
            });
    </script>
</body>
</html>
