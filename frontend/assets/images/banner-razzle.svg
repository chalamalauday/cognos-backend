<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c2e"/>
      <stop offset="50%" stop-color="#1e1828"/>
      <stop offset="100%" stop-color="#0e1320"/>
    </linearGradient>
    <linearGradient id="pinkGradR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF52AF"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="240" rx="16" fill="url(#bgGrad2)"/>

  <!-- Subtle glow in center -->
  <circle cx="300" cy="90" r="100" fill="rgba(65, 105, 225, 0.15)"/>

  <!-- Badge #02 -->
  <rect x="530" y="16" width="50" height="26" rx="13" fill="#090d16" stroke="#334155" stroke-width="1"/>
  <text x="555" y="34" fill="#B0C4DE" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" text-anchor="middle">#02</text>

  <!-- Illustration: Presentation Board with Charts & Speaker -->
  <g transform="translate(250, 15)" filter="url(#shadow2)">
    <!-- Whiteboard Frame -->
    <rect x="0" y="5" width="58" height="42" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Charts inside board -->
    <rect x="6" y="12" width="18" height="18" rx="9" fill="#38bdf8"/>
    <path d="M15 12 L15 21 L24 21 Z" fill="#f59e0b"/>
    <!-- Bar charts -->
    <rect x="30" y="24" width="4" height="16" rx="1" fill="#4169E1"/>
    <rect x="36" y="18" width="4" height="22" rx="1" fill="#FF52AF"/>
    <rect x="42" y="14" width="4" height="26" rx="1" fill="#10b981"/>
    <!-- Stand -->
    <line x1="29" y1="47" x2="20" y2="70" stroke="#64748b" stroke-width="2"/>
    <line x1="29" y1="47" x2="38" y2="70" stroke="#64748b" stroke-width="2"/>

    <!-- Speaker at Podium -->
    <rect x="68" y="34" width="22" height="36" rx="3" fill="#b45309"/>
    <!-- Head & Suit -->
    <circle cx="79" cy="20" r="8" fill="#fed7aa"/>
    <path d="M72 17 Q79 11 86 16 L85 20 Z" fill="#1e293b"/>
    <path d="M70 28 L88 28 L85 45 L73 45 Z" fill="#1e1b4b"/>
    <polygon points="77,28 81,28 79,35" fill="#FF52AF"/>
  </g>

  <!-- Title: RazzleReview -->
  <g transform="translate(300, 155)" text-anchor="middle">
    <!-- Big Stylized Pink R -->
    <text x="-135" y="0" fill="url(#pinkGradR)" font-family="'Georgia', serif" font-size="58" font-weight="900" filter="url(#shadow2)">R</text>
    <!-- Rest of name -->
    <text x="-95" y="-8" fill="url(#orangeGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="42" font-weight="800" text-anchor="start" letter-spacing="1">azzleReview</text>
    <!-- Tagline -->
    <text x="0" y="32" fill="#fda4af" font-family="'Georgia', serif" font-size="15" font-style="italic" letter-spacing="0.5">Flashy , bold &amp; brilliant presentation</text>
  </g>
</svg>
